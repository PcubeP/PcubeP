name: Generate Snake

on:
  # Rebuild the snake once a day so it stays current
  schedule:
    - cron: "17 2 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Rebuild on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#06B6D4&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
